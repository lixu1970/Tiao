<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>调课小程序</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif;color:#18202a}
body{min-height:100vh}
#main{padding:0 9px 10px}
.header{margin:0 -9px 7px;background:#16468d;color:#fff;text-align:center;font-weight:700;font-size:21px;padding:8px 4px}
.tip{font-size:13px;line-height:19px;text-align:center;margin:5px 1px;color:#333}
#input{display:block;width:100%;height:39px;border:1px solid #8c96a5;border-radius:7px;background:#fff;font-size:18px;padding:5px 9px}
.actionrow,.bottom{display:flex;gap:8px;margin-top:7px}
.blue{flex:1;border:0;border-radius:7px;background:#16468d;color:#fff;font-size:16px;font-weight:600;height:39px}
.planhead{display:flex;align-items:center;justify-content:space-between;margin:8px 1px 4px;font-size:16px;font-weight:700}
.pick{display:flex;align-items:center;gap:4px;font-weight:500;font-size:14px}
.pick input{width:22px;height:22px;accent-color:#16468d}
.output{width:100%;min-height:84px;border:1px solid #8c96a5;border-radius:7px;background:#fff;padding:8px;font-size:16px;line-height:23px;white-space:pre-wrap;overflow-wrap:anywhere}
.output.bad{color:#b42318;text-align:center;font-weight:700}
.note{font-size:12px;color:#667085;margin:6px 1px 0;line-height:17px}
.footer{text-align:center;color:#667085;font-size:12px;margin-top:7px}
#browser{display:none;position:fixed;inset:0;background:#fff;z-index:99;overflow:auto;-webkit-overflow-scrolling:touch}
.browserbar{position:sticky;top:0;z-index:3;background:#16468d;color:#fff;padding:8px;text-align:center;font-weight:700}
.browserhint{position:sticky;top:37px;z-index:2;background:#edf3ff;color:#344054;text-align:center;font-size:12px;padding:5px}
.tablewrap{overflow:auto;padding:8px;transform-origin:top left}
table{border-collapse:collapse;font-size:11px;min-width:1600px}
th,td{border:1px solid #777;padding:4px;vertical-align:top;min-width:78px;white-space:pre-wrap}
th{background:#eef3fb;position:sticky;top:63px}
td.slot{position:sticky;left:0;background:#f8fafc;font-weight:700;min-width:48px}
#status{font-size:12px;color:#475467;margin-top:5px;min-height:17px}
@media (min-width:700px){
 #main{max-width:720px;margin:auto}
 .output{min-height:94px}
}
</style>
</head>
<body>
<div id="main">

  <div class="actionrow">
    <button class="blue" onclick="startSchedule()">开始调课</button>
    <button class="blue" onclick="openBrowser()">课表浏览</button>
  </div>

  <div id="plans"></div>
<div class="bottom">
    <button class="blue" onclick="downloadNewTable()">生成新课表</button>
    <button class="blue" onclick="printForm()">打印调课单</button>
    <button class="blue" onclick="clearAll()">清屏</button>
  </div>
<div class="footer">沙河教务 V260910-7</div>
</div>

<div id="browser">
  <div class="browserbar">总课表0910 · 课表浏览</div>

const ACTIVE_SLOTS = DATA.slots;
const FORBIDDEN = new Set(["一56","五56"]);
let currentSolutions = [];
let selectedPlan = 0;

function deepClone(x){ return JSON.parse(JSON.stringify(x)); }
function cellKey(ci,slot){ return ci+"|"+slot; }

function normalizeTeacher(t){ return (t||"").trim(); }

function dayCN(ch){ return ({"一":"一","二":"二","三":"三","四":"四","五":"五"})[ch]||ch; }
function formatSlot(slot){
  if(!slot) return "";
  return "周"+dayCN(slot[0])+slot.slice(1)+"节";
}
function planLabel(n){
  const names=["","一","二","三","四","五","六","七","八","九","十"];
  return n<=10 ? "方案"+names[n] : "方案"+n;
}

function teacherConflict(state, teacher, slot, excludeKeys=[]){
  teacher=normalizeTeacher(teacher);
  if(!teacher) return null;
  const ex=new Set(excludeKeys);
  for(let ci=0;ci<DATA.classes.length;ci++){
    const k=cellKey(ci,slot);
    if(ex.has(k)) continue;
    const a=state[slot][ci];
    if(a && normalizeTeacher(a.teacher)===teacher) return {ci,slot,assignment:a};
  }
  return null;
}

function parseInput(text){
  text=(text||"").replace(/\s+/g,"").replace(/，/g,"、");
  // 标准格式：周二12节杨鸿 / 周二1234节杨鸿 / 周二12节、周三34节杨鸿
  // 同时兼容旧格式：二12杨鸿
  const m=text.match(/^((?:周?[一二三四五][1-6]+节?)(?:、周?[一二三四五][1-6]+节?)*)([\u4e00-\u9fa5]{2,4})$/);
  if(!m) throw new Error("请输入类似：周二12节杨鸿");
  let spec=m[1], teacher=m[2];
  spec=spec.replace(/周/g,"").replace(/节/g,"");
  const parts=spec.split("、").filter(Boolean);
  let requests=[];
  for(const part of parts){
    const mm=part.match(/^([一二三四五])([1-6]+)$/);
    if(!mm) throw new Error("时间格式不正确："+part+"，例如：周二12节");
    const day=mm[1], digits=mm[2];
    let groups=[];
    if(digits.includes("1") || digits.includes("2")){
      if(!(digits.includes("1")&&digits.includes("2"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("12");
    }
    if(digits.includes("3") || digits.includes("4")){
      if(!(digits.includes("3")&&digits.includes("4"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("34");
    }
    if(digits.includes("5") || digits.includes("6")){
      if(!(digits.includes("5")&&digits.includes("6"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("56");
    }
    for(const g of groups){
      const slot=day+g;
      if(FORBIDDEN.has(slot)) throw new Error(formatSlot(slot)+"不是上课时间，不可调");
      if(!ACTIVE_SLOTS.includes(slot)) throw new Error(formatSlot(slot)+"不在当前课表有效时段");
      requests.push(slot);
    }
  }
  requests=[...new Set(requests)];
  if(requests.length>3) throw new Error("一张调课单最多填写3个课表单元格，请分批调课");
  return {teacher,requests};
}

function locateRequests(state, teacher, slots){
  let found=[];
  for(const slot of slots){
    let hits=[];
    for(let ci=0;ci<DATA.classes.length;ci++){
      if(normalizeTeacher(state[slot][ci].teacher)===teacher) hits.push(ci);
    }
    if(hits.length===0) throw new Error(teacher+"在"+formatSlot(slot)+"没有查到课程");
    if(hits.length>1) throw new Error(teacher+"在"+formatSlot(slot)+"原课表已出现撞课，请先核对母表");
    found.push({slot,ci:hits[0]});
  }
  return found;
}

// 在某班两个时段交换完整课程单元格
function applySwap(state, ci, s1, s2){
  const tmp=state[s1][ci];
  state[s1][ci]=state[s2][ci];
  state[s2][ci]=tmp;
}

// 搜索为 helper 在 targetSlot 腾出冲突。
// 返回若干种 {state, ops, helpers}
function resolveConflict(state, helper, targetSlot, excludeKey, helpers, depthLeft, visited){
  const conflict=teacherConflict(state, helper, targetSlot, [excludeKey]);
  if(!conflict) return [{state,ops:[],helpers:new Set(helpers)}];
  if(depthLeft<=0) return [];

  const sig=helper+"@"+targetSlot+"#"+conflict.ci;
  if(visited.has(sig)) return [];
  const nextVisited=new Set(visited); nextVisited.add(sig);

  let out=[];
  const ci=conflict.ci;
  const src=targetSlot; // helper当前冲突课程就在这个时段
  for(const alt of ACTIVE_SLOTS){
    if(alt===src || FORBIDDEN.has(alt)) continue;
    const altA=state[alt][ci];
    if(!altA || !altA.teacher) continue;
    const other=altA.teacher;
    if(other===helper) continue;

    // helper必须能去alt
    if(teacherConflict(state, helper, alt, [cellKey(ci,src)])) continue;

    let newHelpers=new Set(helpers);
    newHelpers.add(helper);
    newHelpers.add(other);
    if(newHelpers.size>3) continue;

    // other要去src，若有冲突则先递归解决
    const prepared=resolveConflict(
      deepClone(state), other, src, cellKey(ci,alt),
      newHelpers, depthLeft-1, nextVisited
    );

    for(const pr of prepared){
      // 再确认交换双方此刻均可落位
      if(teacherConflict(pr.state, helper, alt, [cellKey(ci,src)])) continue;
      if(teacherConflict(pr.state, other, src, [cellKey(ci,alt)])) continue;
      const ns=deepClone(pr.state);
      const before1=ns[src][ci], before2=ns[alt][ci];
      applySwap(ns,ci,src,alt);
      const op={ci,s1:src,s2:alt,a:before1,b:before2,kind:"assist"};
      out.push({state:ns,ops:pr.ops.concat([op]),helpers:new Set(pr.helpers)});
    }
  }
  return out;
}

function findSingleSolutions(baseState, req){
  const {ci,slot:orig}=req;
  const applicant=baseState[orig][ci].teacher;
  let sols=[];

  for(const target of ACTIVE_SLOTS){
    if(target===orig || FORBIDDEN.has(target)) continue;
    const targetA=baseState[target][ci];
    if(!targetA || !targetA.teacher) continue;
    const helper=targetA.teacher;
    if(helper===applicant) continue;

    // 申请人在新时间不能撞课
    if(teacherConflict(baseState, applicant, target, [cellKey(ci,orig)])) continue;

    let helpers=new Set([helper]);
    if(helpers.size>3) continue;

    // helper去申请人的原时间，若撞课则自动腾冲突
    const prepared=resolveConflict(
      deepClone(baseState), helper, orig, cellKey(ci,target),
      helpers, 2, new Set()
    );

    for(const pr of prepared){
      if(teacherConflict(pr.state, applicant, target, [cellKey(ci,orig)])) continue;
      if(teacherConflict(pr.state, helper, orig, [cellKey(ci,target)])) continue;

      const ns=deepClone(pr.state);
      const before1=ns[orig][ci], before2=ns[target][ci];
      applySwap(ns,ci,orig,target);

      const primary={ci,s1:orig,s2:target,a:before1,b:before2,kind:"primary"};
      // 输出顺序按用户习惯：主调换先写，再写解决撞课的辅助调换
      const ops=[primary].concat(pr.ops);

      const hs=new Set(pr.helpers); hs.add(helper);
      if(hs.size>3) continue;

      sols.push({state:ns,ops,helpers:[...hs]});
    }
  }
  return sols;
}

function solveAll(parsed){
  const initial=deepClone(DATA.cells);
  const located=locateRequests(initial,parsed.teacher,parsed.requests);

  // 顺序处理最多3个申请时段，每次在上一次生成的新课表基础上继续
  let branches=[{state:initial,ops:[],helpers:new Set()}];
  for(const req0 of located){
    let next=[];
    for(const br of branches){
      // 在变化后的表里重新定位申请老师该原时段所在班级
      let ci=-1;
      for(let j=0;j<DATA.classes.length;j++){
        if(normalizeTeacher(br.state[req0.slot][j].teacher)===parsed.teacher){ci=j;break;}
      }
      if(ci<0) continue;
      const sols=findSingleSolutions(br.state,{ci,slot:req0.slot});
      for(const s of sols){
        const hs=new Set([...br.helpers,...s.helpers]);
        if(hs.size>3) continue;
        next.push({state:s.state,ops:br.ops.concat(s.ops),helpers:hs});
      }
    }
    branches=next;
    if(branches.length===0) break;
  }

  // 去重，优先：操作次数少、协助老师少
  branches.sort((a,b)=>a.ops.length-b.ops.length || a.helpers.size-b.helpers.size);
  let seen=new Set(), ans=[];
  for(const b of branches){
    const sig=b.ops.map(o=>o.ci+":"+o.s1+"-"+o.s2).join("|");
    if(seen.has(sig)) continue;
    seen.add(sig); ans.push(b);
  }
  return ans;
}

function opText(op, idx, total){
  const cls=DATA.classes[op.ci].label;
  const a=op.a.teacher || "未知";
  const b=op.b.teacher || "未知";
  return `${idx}:${cls}${formatSlot(op.s1)}${a}和${formatSlot(op.s2)}${b}对调${idx===total?"，可完成。":"。"}`;
}

function solutionText(sol){
  return sol.ops.map((o,i)=>opText(o,(i+1),sol.ops.length)).join("\n");
}

function renderPlans(sols){
  const box=document.getElementById("plans");
  box.innerHTML="";
  if(!sols.length){
    box.innerHTML='<div class="output bad" style="margin-top:9px">不可调</div>';
    selectedPlan=0;
    return;
  }
  sols.forEach((sol,i)=>{
    const n=i+1;
    const head=document.createElement("div");
    head.className="planhead";
    head.innerHTML=`<span>${planLabel(n)}</span><label class="pick">是否选择 <input id="c${n}" type="checkbox" onclick="choosePlan(${n})"></label>`;
    const out=document.createElement("div");
    out.className="output";
    out.id="p"+n;
    out.textContent=solutionText(sol);
    box.appendChild(head);
    box.appendChild(out);
  });
  selectedPlan=1;
  document.getElementById("c1").checked=true;
}

function startSchedule(){
  try{
    const parsed=parseInput(document.getElementById("input").value);
    const sols=solveAll(parsed);
    currentSolutions=sols;
    renderPlans(sols);
  }catch(e){
    currentSolutions=[];
    selectedPlan=0;
    const box=document.getElementById("plans");
    box.innerHTML=`<div class="output bad" style="margin-top:9px">${e.message}</div>`;
  }
}

function choosePlan(n){
  if(!currentSolutions[n-1]) return;
  selectedPlan=n;
  document.querySelectorAll('#plans input[type="checkbox"]').forEach((x,i)=>{
    x.checked=(i===n-1);
  });
}

function clearAll(){
  document.getElementById("input").value="";
  document.getElementById("plans").innerHTML="";
  currentSolutions=[];
  selectedPlan=0;
  window.scrollTo({top:0,behavior:"smooth"});
}

function openBrowser(){
  const wrap=document.getElementById("tablewrap");
  if(!wrap.dataset.built){
    let h="<table><tr><th>时间</th>";
    DATA.classes.forEach(c=>h+=`<th>${c.label}<br>${c.className}</th>`);
    h+="</tr>";
    ACTIVE_SLOTS.forEach(slot=>{
      h+=`<tr><td class="slot">${formatSlot(slot)}</td>`;
      DATA.classes.forEach((c,ci)=>{
        const a=DATA.cells[slot][ci];
        h+=`<td>${(a.raw||"").replace(/</g,"&lt;")}</td>`;
      });
      h+="</tr>";
    });
    h+="</table>";
    wrap.innerHTML=h; wrap.dataset.built="1";
  }
  document.getElementById("browser").style.display="block";
}
document.querySelector(".browserhint").onclick=()=>{document.getElementById("browser").style.display="none";};

function b64ToUint8(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return a;
}

function downloadNewTable(){
  if(!selectedPlan || !currentSolutions[selectedPlan-1]){
    alert("请先开始调课并选择一个可行方案");
    return;
  }
  if(typeof XLSX==="undefined"){
    alert("Excel组件未加载，请联网后再试。");
    return;
  }
  const bytes=b64ToUint8(ORIGINAL_XLSX_B64);
  const wb=XLSX.read(bytes,{type:"array",cellStyles:true});
  const ws=wb.Sheets["2-11周课表 (2)"];
  const sol=currentSolutions[selectedPlan-1];

  // 根据最终state，把13个有效时段、19个班级写回原表对应单元格
  for(const slot of ACTIVE_SLOTS){
    const row=DATA.slotToRow[slot]+1; // JS数据行号为0起源于Excel行索引? 这里DATA存的是inspect 0-based，对应Excel行=+1
    for(let ci=0;ci<DATA.classes.length;ci++){
      const colIndex=DATA.classes[ci].col; // 0-based
      const addr=XLSX.utils.encode_cell({r:row-1,c:colIndex});
      if(!ws[addr]) ws[addr]={t:"s",v:""};
      ws[addr].v=sol.state[slot][ci].raw||"";
      ws[addr].t="s";
    }
  }
  XLSX.writeFile(wb,`调课新表_基于0910_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function esc(s){return String(s??"").replace(/[&<>\"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}
function slotDay(s){return dayCN(s[0]);}
function periodText(s){return s.slice(1);}

function printForm(){
  if(!selectedPlan || !currentSolutions[selectedPlan-1]){
    alert("请先选择一个可行方案"); return;
  }
  let parsed;
  try{ parsed=parseInput(document.getElementById("input").value); }
  catch(e){ alert(e.message); return; }
  const sol=currentSolutions[selectedPlan-1];
  const prim=sol.ops.filter(o=>o.kind==="primary");
  const applicant=parsed.teacher;

  let appClass=[], appCourse=[], partners=[];
  prim.forEach(o=>{
    appClass.push(DATA.classes[o.ci].className || DATA.classes[o.ci].label);
    appCourse.push(o.a.course||"");
    partners.push((o.b.teacher||"")+" "+(o.b.course||""));
  });

  let rows="";
  for(let i=0;i<3;i++){
    const o=prim[i];
    if(o){
      rows += `<tr><td class="label">原安排的<br>授课时间</td><td colspan="2">（ ）月（ ）日 星期${slotDay(o.s1)} 第${periodText(o.s1)}节</td><td class="label">现要求调至</td><td colspan="3">（ ）月（ ）日 星期${slotDay(o.s2)} 第${periodText(o.s2)}节</td></tr>`;
    }else{
      rows += `<tr><td class="label">原安排的<br>授课时间</td><td colspan="2">（ ）月（ ）日 星期（ ）第（ ）节</td><td class="label">现要求调至</td><td colspan="3">（ ）月（ ）日 星期（ ）第（ ）节</td></tr>`;
    }
  }

  // 每个非申请人按其在交换中的移动生成通知项
  const notices={};
  function addNotice(t,ci,course,from,to){
    if(!t || t===applicant) return;
    if(!notices[t]) notices[t]=[];
    notices[t].push({ci,course,from,to});
  }
  sol.ops.forEach(o=>{
    addNotice(o.a.teacher,o.ci,o.a.course,o.s1,o.s2);
    addNotice(o.b.teacher,o.ci,o.b.course,o.s2,o.s1);
  });
  let noticeHtml="";
  Object.entries(notices).forEach(([teacher,items],idx)=>{
    let rr="";
    items.forEach(it=>{
      rr+=`<tr><td>${esc(DATA.classes[it.ci].className||DATA.classes[it.ci].label)}</td><td>${esc(it.course)}</td><td></td><td></td><td>${slotDay(it.from)}</td><td>${periodText(it.from)}</td><td></td><td></td><td>${slotDay(it.to)}</td><td>${periodText(it.to)}</td><td></td></tr>`;
    });
    while((rr.match(/<tr>/g)||[]).length<5) rr+=`<tr>${'<td></td>'.repeat(11)}</tr>`;
    noticeHtml+=`<section class="notice pagebreak"><h3>北京市工贸技师学院</h3><h2>课 程 变 动 通 知 单</h2><p><span class="fill">${esc(teacher)}</span> 老师：</p><p>经研究，你的课程作如下调整，请按如下时间调课、授课，谢谢合作。</p><table><tr><th rowspan="2">班级</th><th rowspan="2">课程</th><th colspan="4">原课程</th><th colspan="4">现调</th><th rowspan="2">备注</th></tr><tr><th>周次</th><th>日月</th><th>星期</th><th>节次</th><th>周次</th><th>日月</th><th>星期</th><th>节次</th></tr>${rr}</table><p class="sign">教务科科长签字：　　　　　　年　 月　 日</p></section>`;
  });

  const doc=`<!doctype html><html><head><meta charset="utf-8"><title>调课单</title><style>
  @page{size:A4;margin:18mm 20mm}body{font-family:"SimSun","Microsoft YaHei",serif;color:#000;font-size:13px;margin:0}.sheet{max-width:690px;margin:auto}h3{text-align:center;margin:3px 0 10px;font-size:17px}h2{text-align:center;letter-spacing:8px;margin:8px 0 16px;font-size:22px}p{margin:5px 6px}.meta{display:flex;justify-content:space-between}.fill{color:#000}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #000;padding:4px 3px;text-align:center;vertical-align:middle;height:34px;font-size:12px}.label{width:13%}.approval td{height:45px}.sign{text-align:right;margin-top:14px}.notice{margin-top:8px}.notice table th,.notice table td{height:31px}.pagebreak{page-break-before:always}@media print{button{display:none}.pagebreak{page-break-before:always}}</style></head><body><div class="sheet"><section><h3>北京市工贸技师学院</h3><h2>课 程 变 动 申 请 单</h2><div class="meta"><span>编号：GMXY-QR/7.5-25</span><span>版号：C/0</span></div><table><tr><td class="label">申请调课<br>教师姓名</td><td colspan="2" class="fill">${esc(applicant)}</td><td class="label">调课<br>理由</td><td colspan="3"></td></tr><tr><td class="label">要求调课<br>班级</td><td colspan="2" class="fill">${esc([...new Set(appClass)].join('、'))}</td><td class="label">调课<br>课程</td><td class="fill">${esc([...new Set(appCourse)].join('、'))}</td><td>要与何教师何课程调课</td><td class="fill">${esc([...new Set(partners)].join('；'))}</td></tr>${rows}<tr class="approval"><td>教研室<br>意见</td><td colspan="2"></td><td>教务科<br>意见</td><td colspan="3"></td></tr></table><p class="sign">填单日期：　　年　 月　 日</p></section>${noticeHtml||'<p>本方案没有需要单独通知的被调课教师。</p>'}<p style="text-align:center;margin-top:16px"><button onclick="window.print()">打印 / 保存PDF</button></p></div></body></html>`;
  const w=window.open("","_blank");
  if(!w){alert("浏览器阻止了弹窗，请允许弹窗后再试");return;}
  w.document.open(); w.document.write(doc); w.document.close();
}
</script>
