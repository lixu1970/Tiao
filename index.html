body{min-height:100vh}
#main{padding:0 9px 10px}
.header{margin:0 -9px 7px;background:#16468d;color:#fff;text-align:center;font-weight:700;font-size:21px;padding:8px 4px}

table{border-collapse:collapse;font-size:11px;min-width:1600px}
th,td{border:1px solid #777;padding:4px;vertical-align:top;min-width:78px;white-space:pre-wrap}
th{background:#eef3fb}
td.slot{position:sticky;left:0;background:#f8fafc;font-weight:700;min-width:48px}
#status{font-size:12px;color:#475467;margin-top:5px;min-height:17px}

}

.versionBlock{

}
.versionCard{

}
.versionCard h2{margin:0 0 12px;color:#16468d;font-size:23px}
.versionCard p{font-size:17px;line-height:1.7;margin:0 0 16px}
.versionCard button{
  width:100%;height:46px;border:0;border-radius:8px;background:#16468d;
  color:#fff;font-size:18px;font-weight:700;
}


.classClick{
  color:#16468d;
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:3px;
  font-weight:700;
  cursor:pointer;
  display:inline;
}
.classClick:active{opacity:.65}
.classInfoBox{
  display:none;
  margin:5px 0 9px;
  background:#edf3ff;
  border:1px solid #9bb3d7;
  border-radius:8px;
  padding:9px 10px;
  font-size:15px;
  line-height:23px;
  color:#1d2939;
}
.classInfoBox.show{display:block}
.classInfoTitle{
  color:#16468d;
  font-size:16px;
  font-weight:700;
  margin-bottom:2px;
}
.classInfoRow b{color:#344054}


.classInfoTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.classInfoClose{
  border:0;
  background:#16468d;
  color:#fff;
  width:30px;
  height:30px;
  border-radius:50%;
  font-size:20px;
  line-height:30px;
  padding:0;
  font-weight:700;

.inputSuggestWrap{position:relative;width:100%}

const APP_VERSION = "V260916-4";
async function checkLatestVersion(){
  if(location.protocol==="file:") return;
  try{
    const r=await fetch("./index.html?versionCheck="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const text=await r.text();
    const m=text.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] && m[1]!==APP_VERSION){
      const block=document.getElementById("versionBlock");
      if(block) block.style.display="flex";
      document.documentElement.style.overflow="hidden";
      document.body.style.overflow="hidden";
    }
  }catch(e){}
}

function cellKey(ci,slot){ return ci+"|"+slot; }

function normalizeTeacher(t){ return (t||"").trim(); }

function dayCN(ch){ return ({"一":"一","二":"二","三":"三","四":"四","五":"五"})[ch]||ch; }
function formatSlot(slot){
  if(!slot) return "";
  return "周"+dayCN(slot[0])+slot.slice(1)+"节";
}
function planLabel(n){
  const names=["","一","二","三","四","五","六","七","八","九","十"];
  return n<=10 ? "方案"+names[n] : "方案"+n;
}

function teacherConflict(state, teacher, slot, excludeKeys=[]){
  teacher=normalizeTeacher(teacher);
  if(!teacher) return null;
  const ex=new Set(excludeKeys);
  for(let ci=0;ci<DATA.classes.length;ci++){
    const k=cellKey(ci,slot);
    if(ex.has(k)) continue;
    const a=state[slot][ci];
    if(a && normalizeTeacher(a.teacher)===teacher) return {ci,slot,assignment:a};
  }
  return null;
}

function parseInput(text){
  text=(text||"").replace(/\s+/g,"").replace(/，/g,"、").replace(/星期/g,"周");
  if(!text) throw new Error("请输入调课信息");

  // 支持：
  // 1. 周二12节杨鸿
  // 2. 周二1234节杨鸿
  // 3. 周二12节、周三34节杨鸿
  // 4. 周一1234节秦楠周二12节秦楠周三1234节秦楠
  // 5. 周一1234节、周二12节、周三1234节秦楠
  // 同时兼容旧式“二12杨鸿”

  let chunks=[];
  let repeated = [...text.matchAll(/(?:周)?([一二三四五])([1-6]+)(?:节)?([\u4e00-\u9fa5]{2,4})/g)];

  // 判断是否属于“每个日期后都重复姓名”的连续写法
  if(repeated.length>=2){
    let rebuilt = repeated.map(x=>x[0]).join("");
    let compact = text.replace(/、/g,"");
    if(rebuilt===compact){
      const teacher=repeated[0][3];
      if(repeated.some(x=>x[3]!==teacher)){
        throw new Error("一次申请只能填写同一位老师");
      }
      for(const x of repeated) chunks.push({day:x[1],digits:x[2]});
      return buildParsed(teacher,chunks);
    }
  }

  // 普通写法：姓名只写一次，位于最后
  const mm=text.match(/^(.*?)([\u4e00-\u9fa5]{2,4})$/);
  if(!mm) throw new Error("请输入类似：周二12节杨鸿");
  let spec=mm[1], teacher=mm[2];
  spec=spec.replace(/节/g,"").replace(/周/g,"");
  const parts=spec.split("、").filter(Boolean);

  // 也允许未写顿号但重复“周”字，如：周一1234节周二12节周三34节秦楠
  if(parts.length===1 && /[一二三四五].*[一二三四五]/.test(parts[0])){
    const found=[...spec.matchAll(/([一二三四五])([1-6]+)/g)];
    if(found.length){
      for(const x of found) chunks.push({day:x[1],digits:x[2]});
      return buildParsed(teacher,chunks);
    }
  }

  for(const part of parts){
    const p=part.match(/^([一二三四五])([1-6]+)$/);
    if(!p) throw new Error("时间格式不正确："+part);
    chunks.push({day:p[1],digits:p[2]});
  }
  return buildParsed(teacher,chunks);
}

function buildParsed(teacher,chunks){
  let requests=[];
  for(const item of chunks){
    const day=item.day, digits=item.digits;
    let groups=[];
    if(digits.includes("1") || digits.includes("2")){
      if(!(digits.includes("1")&&digits.includes("2"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("12");
    }
    if(digits.includes("3") || digits.includes("4")){
      if(!(digits.includes("3")&&digits.includes("4"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("34");
    }
    if(digits.includes("5") || digits.includes("6")){
      if(!(digits.includes("5")&&digits.includes("6"))) throw new Error("节次必须按12、34、56成组输入");
      groups.push("56");
    }
    for(const g of groups){
      const slot=day+g;
      if(FORBIDDEN.has(slot)) throw new Error(formatSlot(slot)+"不是上课时间，不可调");
      if(!ACTIVE_SLOTS.includes(slot)) throw new Error(formatSlot(slot)+"不在当前课表有效时段");
      requests.push(slot);
    }
  }
  requests=[...new Set(requests)];
  if(requests.length>3) throw new Error("一张调课单最多填写3个课表单元格，请分批调课");
  return {teacher,requests};
}

function locateRequests(state, teacher, slots){
  let found=[];
  for(const slot of slots){
    let hits=[];
    for(let ci=0;ci<DATA.classes.length;ci++){
      if(normalizeTeacher(state[slot][ci].teacher)===teacher) hits.push(ci);
    }
    if(hits.length===0) throw new Error(teacher+"在"+formatSlot(slot)+"没有查到课程");
    if(hits.length>1) throw new Error(teacher+"在"+formatSlot(slot)+"原课表已出现撞课，请先核对母表");
    found.push({slot,ci:hits[0]});
  }
  return found;
}

// 在某班两个时段交换完整课程单元格
function applySwap(state, ci, s1, s2){
  const tmp=state[s1][ci];
  state[s1][ci]=state[s2][ci];
  state[s2][ci]=tmp;
}

// 搜索为 helper 在 targetSlot 腾出冲突。
// 返回若干种 {state, ops, helpers}
function resolveConflict(state, helper, targetSlot, excludeKey, helpers, depthLeft, visited){
  const conflict=teacherConflict(state, helper, targetSlot, [excludeKey]);
  if(!conflict) return [{state,ops:[],helpers:new Set(helpers)}];
  if(depthLeft<=0) return [];

  const sig=helper+"@"+targetSlot+"#"+conflict.ci;
  if(visited.has(sig)) return [];
  const nextVisited=new Set(visited); nextVisited.add(sig);

  let out=[];
  const ci=conflict.ci;
  const src=targetSlot; // helper当前冲突课程就在这个时段
  for(const alt of ACTIVE_SLOTS){
    if(alt===src || FORBIDDEN.has(alt)) continue;
    const altA=state[alt][ci];
    if(!altA || !altA.teacher) continue;
    const other=altA.teacher;
    if(other===helper) continue;

    // helper必须能去alt
    if(teacherConflict(state, helper, alt, [cellKey(ci,src)])) continue;

    let newHelpers=new Set(helpers);
    newHelpers.add(helper);
    newHelpers.add(other);
    if(newHelpers.size>3) continue;

    // other要去src，若有冲突则先递归解决
    const prepared=resolveConflict(
      deepClone(state), other, src, cellKey(ci,alt),
      newHelpers, depthLeft-1, nextVisited
    );

    for(const pr of prepared){
      // 再确认交换双方此刻均可落位
      if(teacherConflict(pr.state, helper, alt, [cellKey(ci,src)])) continue;
      if(teacherConflict(pr.state, other, src, [cellKey(ci,alt)])) continue;
      const ns=deepClone(pr.state);
      const before1=ns[src][ci], before2=ns[alt][ci];
      applySwap(ns,ci,src,alt);
      const op={ci,s1:src,s2:alt,a:before1,b:before2,kind:"assist"};
      out.push({state:ns,ops:pr.ops.concat([op]),helpers:new Set(pr.helpers)});
    }
  }
  return out;
}

function findSingleSolutions(baseState, req){
  const {ci,slot:orig}=req;
  const applicant=baseState[orig][ci].teacher;
  let sols=[];

  for(const target of ACTIVE_SLOTS){
    if(target===orig || FORBIDDEN.has(target)) continue;
    const targetA=baseState[target][ci];
    if(!targetA || !targetA.teacher) continue;
    const helper=targetA.teacher;
    if(helper===applicant) continue;

    // 申请人在新时间不能撞课
    if(teacherConflict(baseState, applicant, target, [cellKey(ci,orig)])) continue;

    let helpers=new Set([helper]);
    if(helpers.size>3) continue;

    // helper去申请人的原时间，若撞课则自动腾冲突
    const prepared=resolveConflict(
      deepClone(baseState), helper, orig, cellKey(ci,target),
      helpers, 2, new Set()
    );

    for(const pr of prepared){
      if(teacherConflict(pr.state, applicant, target, [cellKey(ci,orig)])) continue;
      if(teacherConflict(pr.state, helper, orig, [cellKey(ci,target)])) continue;

      const ns=deepClone(pr.state);
      const before1=ns[orig][ci], before2=ns[target][ci];
      applySwap(ns,ci,orig,target);

      const primary={ci,s1:orig,s2:target,a:before1,b:before2,kind:"primary"};
      // 输出顺序按用户习惯：主调换先写，再写解决撞课的辅助调换
      const ops=[primary].concat(pr.ops);

      const assistedMoves=ops.filter(o=>o.kind==="assist").length;
      if(assistedMoves>1) continue;

      const hs=new Set(pr.helpers); hs.add(helper);
      if(hs.size>3) continue;

      sols.push({state:ns,ops,helpers:[...hs]});
    }
  }
  return sols;
}

function solveAll(parsed){
  const initial=deepClone(DATA.cells);
  const located=locateRequests(initial,parsed.teacher,parsed.requests);

  // 顺序处理最多3个申请时段，每次在上一次生成的新课表基础上继续
  let branches=[{state:initial,ops:[],helpers:new Set()}];
  for(const req0 of located){
    let next=[];
    for(const br of branches){
      // 在变化后的表里重新定位申请老师该原时段所在班级
      let ci=-1;
      for(let j=0;j<DATA.classes.length;j++){
        if(normalizeTeacher(br.state[req0.slot][j].teacher)===parsed.teacher){ci=j;break;}
      }
      if(ci<0) continue;
      const sols=findSingleSolutions(br.state,{ci,slot:req0.slot});
      for(const s of sols){
        const hs=new Set([...br.helpers,...s.helpers]);
        if(hs.size>3) continue;

        const combinedOps=br.ops.concat(s.ops);
        const combinedAssist=combinedOps.filter(o=>o.kind==="assist").length;
        if(combinedAssist>1) continue;
        next.push({state:s.state,ops:br.ops.concat(s.ops),helpers:hs});
      }
    }
    branches=next;
    if(branches.length===0) break;
  }

  // 去重，优先：操作次数少、协助老师少
  branches.sort((a,b)=>a.ops.length-b.ops.length || a.helpers.size-b.helpers.size);
  let seen=new Set(), ans=[];
  for(const b of branches){
    const sig=b.ops.map(o=>o.ci+":"+o.s1+"-"+o.s2).join("|");
    if(seen.has(sig)) continue;
    seen.add(sig); ans.push(b);
  }
  return ans;
}

function escapeHtml(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


const TEACHERS = ["于向东", "冯彦", "刘天一", "刘晟典", "刘运琦", "周静", "常锋", "张军霞", "张梓煜", "徐倩", "徐邦仪", "易强文", "朱彩兰", "李昀倩", "李晓菲", "李晶", "杨鸿", "柳德攀", "洪轩", "王帅", "王晓丽", "王欢欢", "秦楠", "程露", "耿红梅", "胡雪静", "贾宇鹏", "赵丰", "赵峰", "邓建军", "邢建姝", "邢方凯", "阮宸宇", "顾小颜", "高伟"];
function updateTeacherSuggestions(){
  const input=document.getElementById("input"), box=document.getElementById("teacherSuggestions");
  if(!input||!box) return;
  const value=input.value.replace(/\s+/g,"");
  const m=value.match(/(?:节|[1-6])([\u4e00-\u9fa5]{1,4})$/);
  if(!m){box.classList.remove("show");box.innerHTML="";return;}
  const part=m[1];
  if(TEACHERS.includes(part)){box.classList.remove("show");box.innerHTML="";return;}
  const matches=TEACHERS.filter(n=>n.startsWith(part)).slice(0,8);
  if(!matches.length){box.classList.remove("show");box.innerHTML="";return;}
  box.innerHTML=matches.map(n=>`<div class="teacherSuggestItem" data-name="${escapeHtml(n)}">${escapeHtml(n)}</div>`).join("");
  box.classList.add("show");
  box.querySelectorAll(".teacherSuggestItem").forEach(item=>{
    item.onclick=function(){
      input.value=value.slice(0,value.length-part.length)+this.dataset.name;
      box.classList.remove("show");box.innerHTML="";input.focus();
    };
  });
}
document.getElementById("input").addEventListener("input",updateTeacherSuggestions);
document.addEventListener("click",e=>{
  if(!e.target.closest(".inputSuggestWrap")){
    const box=document.getElementById("teacherSuggestions");
    if(box){box.classList.remove("show");box.innerHTML="";}
  }
});

function opHtml(op, idx, total){
  const c=DATA.classes[op.ci];
  const a=escapeHtml(op.a.teacher || "未知");
  const b=escapeHtml(op.b.teacher || "未知");

  return `${idx}:<span class="classClick" onclick="showClassInfo(${op.ci},this)">${escapeHtml(c.label)}</span>${escapeHtml(formatSlot(op.s1))}${a}和${escapeHtml(formatSlot(op.s2))}${b}对调${idx===total?"，可完成。":"。"}`;

function solutionText(sol){
  const lines=sol.ops.map((o,i)=>opText(o,(i+1),sol.ops.length));
  if(!lines.length) return "";

  const first=lines[0];
  const pos=first.indexOf("和");
  if(pos>=0){
    lines[0]="可以和同班"+first.slice(pos+1);
  }
  return lines.join("\n");
}

function solutionHtml(sol){
  const lines=sol.ops.map((o,i)=>opHtml(o,(i+1),sol.ops.length));
  if(!lines.length) return "";

  // 只修改整个方案框中第一次出现“和”之前的内容，
  // 并在“和”字后增加“同班”两字。
  // “可以”仍保留第一条原班级的点击弹窗功能。
  const firstOp=sol.ops[0];
  const firstClass=DATA.classes[firstOp.ci];
  const pos=lines[0].indexOf("和");
  if(pos>=0){
    lines[0]=
      `<span class="classClick" title="点击查看${escapeHtml(firstClass.label)}信息" onclick="showClassInfo(${firstOp.ci},this)">可以</span>`+
      "和同班"+
      lines[0].slice(pos+1);
  }

  // 第二条及以后完全保持原方案设计
  return lines.join("<br>");
}

function showClassInfo(ci,el){
  const c=DATA.classes[ci];
  const planWrap=el.closest(".planGroup");
  if(!planWrap) return;
  const info=planWrap.querySelector(".classInfoBox");
  if(!info) return;

  const current=info.dataset.classIndex;

  // 再次点击同一个班：关闭
  if(info.classList.contains("show") && current===String(ci)){
    closeClassInfo(info);
    return;
  }

  info.dataset.classIndex=String(ci);
  info.innerHTML=
    `<div class="classInfoTop">`+
      `<div class="classInfoTitle">${escapeHtml(c.label)} 班级信息</div>`+
      `<button class="classInfoClose" onclick="closeClassInfo(this.closest('.classInfoBox'))">×</button>`+
    `</div>`+
    `<div class="classInfoRow"><b>完整班号：</b>${escapeHtml(c.className)}</div>`+
    `<div class="classInfoRow"><b>班主任：</b>${escapeHtml(c.head)}</div>`+
    `<div class="classInfoRow"><b>人数：</b>${escapeHtml(c.studentCount)}人</div>`+
    `<div class="classInfoRow"><b>上课地点：</b>${escapeHtml(c.classrooms)}</div>`;
  info.classList.add("show");
}

function closeClassInfo(info){
  if(!info) return;
  info.classList.remove("show");
  info.innerHTML="";
  info.dataset.classIndex="";
}

function renderPlans(sols){
  const box=document.getElementById("plans");
  box.innerHTML="";
  if(!sols.length){
    box.innerHTML='<div class="output bad" style="margin-top:9px">不可调</div>';
    selectedPlan=0;
    return;
  }
  sols.forEach((sol,i)=>{
    const n=i+1;
    const group=document.createElement("div");
    group.className="planGroup";

    const head=document.createElement("div");
    head.className="planhead";
    head.innerHTML=`<span>${planLabel(n)}</span><label class="pick">是否选择 <input id="c${n}" type="checkbox" onclick="choosePlan(${n})"></label>`;

    const out=document.createElement("div");
    out.className="output";
    out.id="p"+n;
    out.innerHTML=solutionHtml(sol);

    const info=document.createElement("div");
    info.className="classInfoBox";

    group.appendChild(head);
    group.appendChild(out);
    group.appendChild(info);
    box.appendChild(group);
  });
  selectedPlan=1;
  document.getElementById("c1").checked=true;
}

function startSchedule(){
  try{
    const parsed=parseInput(document.getElementById("input").value);
    const sols=solveAll(parsed);
    currentSolutions=sols;
    renderPlans(sols);
  }catch(e){
    currentSolutions=[];
    selectedPlan=0;
    const box=document.getElementById("plans");
    box.innerHTML=`<div class="output bad" style="margin-top:9px">${e.message}</div>`;
  }
}

function choosePlan(n){
  if(!currentSolutions[n-1]) return;
  selectedPlan=n;
  document.querySelectorAll('#plans input[type="checkbox"]').forEach((x,i)=>{
    x.checked=(i===n-1);
  });
}

function clearAll(){
  document.getElementById("input").value="";
  document.getElementById("plans").innerHTML="";
  currentSolutions=[];
  selectedPlan=0;
  window.scrollTo({top:0,behavior:"smooth"});
}

function b64ToUint8(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return a;
}

async function downloadNewTable(){
  if(!selectedPlan || !currentSolutions[selectedPlan-1]){
    alert("请先开始调课并选择一个可行方案");
    return;
  }
  if(typeof JSZip==="undefined"){
    alert("课表生成组件未加载，请联网后重新打开网页再试。");
    return;
  }

  // 每次调课都固定以总课表0916为母表，不累计上一次生成的新课表。
  const sol=currentSolutions[selectedPlan-1];

  try{
    // 直接打开原始总课表0916的 XLSX 压缩包。
    // 不重新创建工作簿，不重新创建工作表，不重建任何格式。
    const originalBytes=b64ToUint8(ORIGINAL_XLSX_B64);
    const zip=await JSZip.loadAsync(originalBytes);

    const sheetPath="xl/worksheets/sheet1.xml";
    const sheetFile=zip.file(sheetPath);
    if(!sheetFile) throw new Error("未找到原课表工作表");

    let sheetXml=await sheetFile.async("string");

    // ---------- 为调课单元格建立橙色/蓝色底色样式 ----------
    // 只在原样式基础上改 fill，字体/字号/边框/对齐/自动换行等全部沿用原样式。
    const stylesPath="xl/styles.xml";
    const stylesFile=zip.file(stylesPath);
    if(!stylesFile) throw new Error("未找到原课表样式文件");
    let stylesXml=await stylesFile.async("string");

    function ensureSolidFill(stylesXml,color){
      const fillsMatch=stylesXml.match(/<fills\b[^>]*count="(\d+)"[^>]*>([\s\S]*?)<\/fills>/);
      if(!fillsMatch) throw new Error("无法读取原课表填充样式");
      const oldCount=parseInt(fillsMatch[1],10);
      const fillXml='<fill><patternFill patternType="solid"><fgColor rgb="'+color+'"/><bgColor indexed="64"/></patternFill></fill>';
      const newFills=fillsMatch[0]
        .replace('count="'+oldCount+'"','count="'+(oldCount+1)+'"')
        .replace('</fills>',fillXml+'</fills>');
      stylesXml=stylesXml.replace(fillsMatch[0],newFills);
      return {xml:stylesXml,fillId:oldCount};
    }

    // Excel ARGB
    let r=ensureSolidFill(stylesXml,"FFFFA500"); // 橙色
    stylesXml=r.xml;
    const orangeFillId=r.fillId;

    r=ensureSolidFill(stylesXml,"FF5B9BD5"); // 蓝色
    stylesXml=r.xml;
    const blueFillId=r.fillId;

    function cloneStyleWithFill(styleId,fillId){
      const xfsMatch=stylesXml.match(/<cellXfs\b[^>]*count="(\d+)"[^>]*>([\s\S]*?)<\/cellXfs>/);
      if(!xfsMatch) throw new Error("无法读取原课表单元格样式");

      const xfList=[...xfsMatch[2].matchAll(/<xf\b[^>]*(?:\/>|>[\s\S]*?<\/xf>)/g)].map(x=>x[0]);
      const base=xfList[styleId];
      if(!base) throw new Error("原课表样式索引不存在："+styleId);

      let cloned=base;
      if(/\bfillId="\d+"/.test(cloned)){
        cloned=cloned.replace(/\bfillId="\d+"/,'fillId="'+fillId+'"');
      }else{
        cloned=cloned.replace(/^<xf\b/,'<xf fillId="'+fillId+'"');
      }

      if(/\bapplyFill="\d+"/.test(cloned)){
        cloned=cloned.replace(/\bapplyFill="\d+"/,'applyFill="1"');
      }else{
        cloned=cloned.replace(/^<xf\b/,'<xf applyFill="1"');
      }

      const oldCount=parseInt(xfsMatch[1],10);
      const newXfs=xfsMatch[0]
        .replace('count="'+oldCount+'"','count="'+(oldCount+1)+'"')
        .replace('</cellXfs>',cloned+'</cellXfs>');
      stylesXml=stylesXml.replace(xfsMatch[0],newXfs);
      return oldCount;
    }

    function getCellStyleId(ref){
      const reCell=new RegExp('<c\\b([^>]*)\\br="'+ref+'"([^>]*)>');
      const m=sheetXml.match(reCell);
      if(!m) return 0;
      const attrs=(m[1]||"")+" "+(m[2]||"");
      const sm=attrs.match(/\bs="(\d+)"/);
      return sm?parseInt(sm[1],10):0;
    }

    function setCellStyleId(ref,newStyleId){
      const reCell=new RegExp('<c\\b([^>]*)\\br="'+ref+'"([^>]*)>');
      const m=sheetXml.match(reCell);
      if(!m) return;
      let tag=m[0];
      if(/\bs="\d+"/.test(tag)){
        tag=tag.replace(/\bs="\d+"/,' s="'+newStyleId+'"');
      }else{
        tag=tag.replace(/<c\b/,'<c s="'+newStyleId+'"');
      }
      sheetXml=sheetXml.replace(m[0],tag);
    }

    // 记录本次方案中哪些单元格需要着色：
    // primary = 申请人的主调课，橙色
    // assist  = 为解决撞课产生的被动调课，蓝色
    const orangeRefs=new Set();
    const blueRefs=new Set();

    for(const op of sol.ops){
      const row1=DATA.slotToRow[op.s1]+1;
      const row2=DATA.slotToRow[op.s2]+1;
      const col=DATA.classes[op.ci].excelCol;
      const ref1=col+row1;
      const ref2=col+row2;

      if(op.kind==="primary"){
        orangeRefs.add(ref1);
        orangeRefs.add(ref2);
      }else{
        blueRefs.add(ref1);
        blueRefs.add(ref2);
      }
    }

    // 若同一格同时出现，申请人主调课优先显示橙色
    for(const ref of orangeRefs) blueRefs.delete(ref);

    const styleCache=new Map();
    function coloredStyleFor(ref,fillId){
      const oldStyle=getCellStyleId(ref);
      const key=oldStyle+"|"+fillId;
      if(styleCache.has(key)) return styleCache.get(key);
      const newStyle=cloneStyleWithFill(oldStyle,fillId);
      styleCache.set(key,newStyle);
      return newStyle;
    }

    for(const ref of blueRefs){
      setCellStyleId(ref,coloredStyleFor(ref,blueFillId));
    }
    for(const ref of orangeRefs){
      setCellStyleId(ref,coloredStyleFor(ref,orangeFillId));
    }

    zip.file(stylesPath,stylesXml);

    // 只修改 C:U、13个有效上课时段对应单元格的“共享字符串索引”。
    // 单元格自身的 style(s)、行高、列宽、合并、边框、底色、对齐、
    // 自动换行、打印设置、标题、班主任、人数、教室等均不触碰。
    for(const slot of ACTIVE_SLOTS){
      const excelRow=DATA.slotToRow[slot]+1;

      for(let ci=0;ci<DATA.classes.length;ci++){
        const ref=DATA.classes[ci].excelCol+excelRow;
        const sstIndex=sol.state[slot][ci].sstIndex;

        if(sstIndex===undefined || sstIndex===null){
          throw new Error("课程数据缺少原格式索引："+ref);
        }

        // 定位原单元格 XML，只替换 <v>...</v> 中的值；
        // <c> 上的 s="样式编号" 等全部原样保留。
        const reCell=new RegExp(
          '(<c\\b[^>]*\\br="'+ref+'"[^>]*>)([\\s\\S]*?)(<\\/c>)'
        );

        const match=sheetXml.match(reCell);
        if(!match){
          throw new Error("原课表中未找到单元格："+ref);
        }

        let inner=match[2];

        if(/<v>[\s\S]*?<\/v>/.test(inner)){
          inner=inner.replace(/<v>[\s\S]*?<\/v>/, "<v>"+sstIndex+"</v>");
        }else{
          inner=inner+"<v>"+sstIndex+"</v>";
        }

        const replacement=match[1]+inner+match[3];
        sheetXml=sheetXml.replace(reCell, replacement);
      }
    }

    // 只把修改后的 sheet1.xml 放回原 XLSX，其余所有文件原封不动。
    zip.file(sheetPath, sheetXml);

    const blob=await zip.generateAsync({
      type:"blob",
      mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      compression:"DEFLATE"
    });

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="调课新表_0916基础_橙蓝标记_"+new Date().toISOString().slice(0,10)+".xlsx";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);

    // 生成后清除当前申请；下一次调课仍重新从总课表0916开始。
    document.getElementById("input").value="";
    document.getElementById("plans").innerHTML="";
    currentSolutions=[];
    selectedPlan=0;
    window.scrollTo({top:0,behavior:"smooth"});

  }catch(e){
    console.error(e);
    alert("生成新课表失败："+e.message);
  }
}

function esc(s){return String(s??"").replace(/[&<>\"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}

function periodText(s){return s.slice(1);}

<script>
function cleanSheetHtml(){
  var sheet=document.querySelector(".sheet");
  if(!sheet) return "";
  var copy=sheet.cloneNode(true);

function triggerDownload(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1800);
}

}

async function downloadDocxForm(){
  try{
    // 优先调用原调课网页已经加载的docx组件；避免预览窗口再次加载失败
    var D=(window.opener && window.opener.docx) ? window.opener.docx : window.docx;
    if(!D){
      alert("DOCX组件当前没有加载成功。请改用“下载DOC”或“下载HTML”，这两种都可以继续修改。 ");
      return;
    }

    const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,PageBreak}=D;
    const sheet=document.querySelector(".sheet");
    if(!sheet){ alert("没有找到调课单内容"); return; }
    const children=[];

    function addText(el){
      const txt=(el.innerText||"").trim();
      if(!txt) return;
      children.push(new Paragraph({children:[new TextRun({text:txt,font:"SimSun",size:22,color:"000000"})],spacing:{after:100}}));
    }
    function tableToDocx(tableEl){
      const rows=[...tableEl.rows].map(tr=>new TableRow({children:[...tr.cells].map(td=>new TableCell({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:(td.innerText||"").trim(),font:"SimSun",size:20,color:"000000"})]})]}))}));
      return new Table({rows,width:{size:100,type:WidthType.PERCENTAGE},borders:{top:{style:BorderStyle.SINGLE,size:4,color:"000000"},bottom:{style:BorderStyle.SINGLE,size:4,color:"000000"},left:{style:BorderStyle.SINGLE,size:4,color:"000000"},right:{style:BorderStyle.SINGLE,size:4,color:"000000"},insideHorizontal:{style:BorderStyle.SINGLE,size:4,color:"000000"},insideVertical:{style:BorderStyle.SINGLE,size:4,color:"000000"}}});
    }

    [...sheet.children].forEach(el=>{
      if(el.classList && el.classList.contains("pagebreak") && children.length) children.push(new Paragraph({children:[new PageBreak()]}));
      if(el.tagName==="TABLE") children.push(tableToDocx(el));
      else if(el.querySelectorAll && el.querySelectorAll("table").length){
        [...el.children].forEach(node=>{ if(node.tagName==="TABLE") children.push(tableToDocx(node)); else addText(node); });
      }else addText(el);
    });

    const doc=new Document({sections:[{properties:{page:{margin:{top:900,right:900,bottom:900,left:900}}},children}]});
    const blob=await Packer.toBlob(doc);
    triggerDownload(blob,"调课单_可修改版.docx");
  }catch(e){
    console.error(e);
    alert("DOCX下载未成功。请改用“下载DOC”或“下载HTML”，都可以修改。 ");
  }
}

function returnToSchedule(){
  try{
    window.close();
  }catch(e){}
  setTimeout(function(){
    if(window.opener && !window.opener.closed){
      window.opener.focus();
    }else{
      history.back();
    }
  },120);
}
